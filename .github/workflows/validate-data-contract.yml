name: Data Contract Validation

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/validate-data-contract.yml'
      - '.github/actions/**'
      - '.github/scripts/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  # ── Job 1: Validate ───────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.changed.outputs.all_changed_files }}

    steps:
      - uses: actions/checkout@v4

      - name: Find changed contract files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: 'contracts/**'

      - name: Validate contracts
        if: steps.changed.outputs.any_changed == 'true'
        uses: ./.github/actions/data-contract-validate
        with:
          changed-files: ${{ steps.changed.outputs.all_changed_files }}
          url:           ${{ secrets.PLATFORM_URL }}
          api-key:       ${{ secrets.PLATFORM_API_KEY }}
          pr-number:     ${{ github.event.pull_request.number }}
          repository:    ${{ github.repository }}
          github-token:  ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: Create (only runs when validate succeeds) ─────────────────────
  create:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      contract_ids: ${{ steps.create.outputs.contract-ids }}

    steps:
      - uses: actions/checkout@v4

      - name: Find changed contract files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: 'contracts/**'

      - name: Create or update contracts
        id: create
        if: steps.changed.outputs.any_changed == 'true'
        uses: ./.github/actions/data-contract-create
        with:
          changed-files: ${{ steps.changed.outputs.all_changed_files }}
          url:           ${{ secrets.PLATFORM_URL }}
          api-key:       ${{ secrets.PLATFORM_API_KEY }}
          pr-number:     ${{ github.event.pull_request.number }}
          repository:    ${{ github.repository }}
          github-token:  ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: Test (only runs when create succeeds) ──────────────────────────
  test:
    needs: create
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run contract tests
        if: needs.create.outputs.contract_ids != ''
        uses: ./.github/actions/data-contract-test
        with:
          contract-ids:  ${{ needs.create.outputs.contract_ids }}
          url:           ${{ secrets.PLATFORM_URL }}
          api-key:       ${{ secrets.PLATFORM_API_KEY }}
          pr-number:     ${{ github.event.pull_request.number }}
          repository:    ${{ github.repository }}
          github-token:  ${{ secrets.GITHUB_TOKEN }}

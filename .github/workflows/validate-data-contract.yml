name: Data Contract Validation

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/validate-data-contract.yml'

permissions:
  pull-requests: write
  contents: read

env:
  URL:        ${{ secrets.URL }}
  API_KEY:    ${{ secrets.API_KEY }}
  PROJECT_ID: ${{ secrets.PROJECT_ID }}

jobs:
  # ── Job 1: Validate ───────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find changed contract files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: 'contracts/**'

      - name: Install data-intelligence-sdk
        run: |
          pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "data-intelligence-sdk==2.2.0rc1"

      - name: Validate contracts
        id: validate
        run: |
          RESULT_MD="## 🔍 Data Contract Validation\n\n"
          OVERALL=0

          for f in ${{ steps.changed.outputs.all_changed_files }}; do
            echo "Validating $f ..."
            if python3 .github/scripts/validate_contract.py "$f" > /tmp/val_out.txt 2>&1; then
              RESULT_MD+="### ✅ \`$f\` — valid\n\n"
            else
              OVERALL=1
              ERRORS=$(cat /tmp/val_out.txt)
              RESULT_MD+="### ❌ \`$f\` — validation failed\n\n\`\`\`\n${ERRORS}\n\`\`\`\n\n"
            fi
          done

          echo "body<<EOF" >> $GITHUB_OUTPUT
          printf "%b" "$RESULT_MD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "overall=$OVERALL" >> $GITHUB_OUTPUT
          echo "changed_files=${{ steps.changed.outputs.all_changed_files }}" >> $GITHUB_OUTPUT

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.validate.outputs.body }}
        run: |
          printf "%b" "$BODY" > /tmp/pr_body.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/pr_body.md \
            --repo "${{ github.repository }}"

      - name: Fail if validation failed
        if: steps.validate.outputs.overall == '1'
        run: exit 1

  # ── Job 2: Create (only runs when validate succeeds) ─────────────────────
  create:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find changed contract files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: 'contracts/**'

      - name: Install data-intelligence-sdk
        run: |
          pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "data-intelligence-sdk==2.2.0rc1"

      - name: Create or update contracts
        id: create
        run: |
          python3 - <<'PYEOF'
          import os, sys, requests

          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          from wxdi.data_contracts import DataContractsProvider
          from wxdi.data_contracts.models import DataContractPrototypeYaml
          from wxdi.dq_validator.provider.config import ProviderConfig

          resp = requests.post(
              "https://iam.test.cloud.ibm.com/identity/token",
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              data={
                  "grant_type": "urn:ibm:params:oauth:grant-type:apikey",
                  "apikey": os.environ["API_KEY"],
              },
              timeout=30,
          )
          resp.raise_for_status()
          bearer = "Bearer " + resp.json()["access_token"]

          config     = ProviderConfig(url=os.environ["URL"], auth_token=bearer)
          provider   = DataContractsProvider(config)
          project_id = os.environ["PROJECT_ID"]

          files = "${{ needs.validate.outputs.changed_files || steps.changed.outputs.all_changed_files }}".split()
          if not files or files == [""]:
              print("No changed contract files — nothing to create.")
              sys.exit(0)

          result_lines = []
          for f in files:
              name = os.path.splitext(os.path.basename(f))[0]
              with open(f, "r", encoding="utf-8") as fh:
                  content = fh.read()

              collection = provider.list_project_data_contracts(project_id, limit=200)
              existing   = next((dc for dc in collection.data_contracts if dc.name == name), None)

              body = DataContractPrototypeYaml(name=name, contract_yaml=content)
              if existing:
                  contract = provider.replace_project_data_contract(
                      project_id, existing.id, body, validate=True
                  )
                  result_lines.append(f"### 🔄 `{f}` — updated (id: `{contract.id}`)")
                  print(f"Updated  {f}  →  id={contract.id}")
              else:
                  contract = provider.create_project_data_contract(
                      project_id, body, validate=True
                  )
                  result_lines.append(f"### ✅ `{f}` — created (id: `{contract.id}`)")
                  print(f"Created  {f}  →  id={contract.id}")

          md = "## 📦 Data Contract Create\n\n" + "\n\n".join(result_lines) + "\n"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("body<<EOF\n")
              out.write(md + "\n")
              out.write("EOF\n")
          PYEOF

      - name: Post PR comment (success)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY:     ${{ steps.create.outputs.body }}
        run: |
          printf "%b" "$BODY" > /tmp/pr_body.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/pr_body.md \
            --repo "${{ github.repository }}"

      - name: Post PR comment (failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.changed.outcome }}" = "failure" ]; then
            FAILED_STEP="Find changed contract files"
          elif [ "${{ steps.create.outcome }}" = "failure" ]; then
            FAILED_STEP="Create or update contracts"
          else
            FAILED_STEP="Install data-intelligence-sdk"
          fi

          cat > /tmp/pr_body.md <<MDEOF
          ## ❌ Data Contract Create — failed

          **Failed step:** \`${FAILED_STEP}\`

          \`\`\`
          See the workflow logs for the full error output.
          \`\`\`

          > [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          MDEOF

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/pr_body.md \
            --repo "${{ github.repository }}"

name: Data Contract Validation & Test

on:
  push:
    branches-ignore: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/validate-data-contract.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/validate-data-contract.yml'
  pull_request_target:
    types: [closed]      # cleanup on PR close

permissions:
  pull-requests: write
  contents: read

env:
  URL:        ${{ secrets.URL }}
  TOKEN:      ${{ secrets.TOKEN }}
  PROJECT_ID: ${{ secrets.PROJECT_ID }}

jobs:
  # ── Cleanup job: runs only when PR is merged/closed ──────────────────────
  cleanup:
    if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install data-intelligence-sdk
        run: |
          pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "data-intelligence-sdk==2.2.0rc1"

      - name: Deregister transient PR contracts
        run: |
          echo "Cleanup: removing ephemeral contracts for PR #${{ github.event.pull_request.number }}"
          python3 -c "
          import os
          from wxdi.data_contracts import DataContractsProvider
          from wxdi.dq_validator.provider.config import ProviderConfig
          token = os.environ['TOKEN']
          bearer = token if token.startswith('Bearer ') else f'Bearer {token}'
          config = ProviderConfig(url=os.environ['URL'], auth_token=bearer)
          provider = DataContractsProvider(config)
          pr = '${{ github.event.pull_request.number }}'
          result = provider.list_project_data_contracts(os.environ['PROJECT_ID'])
          for dc in result.data_contracts:
              if dc.name and f'pr-{pr}' in (dc.name or ''):
                  provider.delete_project_data_contracts(os.environ['PROJECT_ID'], data_contract_ids=dc.id)
                  print(f'Deleted contract {dc.id} ({dc.name})')
          " || true

  # ── Main validation + publish + asset-check job ───────────────────────────
  validate-and-test:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find changed contract files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: 'contracts/**'

      # ── INSTALL ───────────────────────────────────────────────────────────
      - name: Install data-intelligence-sdk
        run: |
          pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "data-intelligence-sdk==2.2.0rc1"

      # ── STAGE 1: VALIDATE ─────────────────────────────────────────────────
      - name: Validate contracts
        id: validate
        run: |
          RESULT_MD="## 🔍 Data Contract Validation\n\n"
          OVERALL=0

          for f in ${{ steps.changed.outputs.all_changed_files }}; do
            echo "Validating $f ..."
            if python3 .github/scripts/validate_contract.py "$f" > /tmp/val_out.txt 2>&1; then
              RESULT_MD+="### ✅ \`$f\` — schema valid\n\n"
            else
              OVERALL=1
              ERRORS=$(cat /tmp/val_out.txt)
              RESULT_MD+="### ❌ \`$f\` — validation failed\n\n\`\`\`\n${ERRORS}\n\`\`\`\n\n"
            fi
          done

          echo "body_val<<EOF" >> $GITHUB_OUTPUT
          printf "%b" "$RESULT_MD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "overall=$OVERALL" >> $GITHUB_OUTPUT

      # Post interim comment immediately so the author sees validation status
      - name: Post interim PR comment (validation result)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(printf "%b" "${{ steps.validate.outputs.body_val }}")
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$BODY" \
            --repo "${{ github.repository }}" \
            --edit-last 2>/dev/null || \
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$BODY" \
            --repo "${{ github.repository }}"

      - name: Stop if validation failed
        if: steps.validate.outputs.overall == '1'
        run: exit 1

      # ── STAGE 2: CREATE / UPDATE ──────────────────────────────────────────
      - name: Create or update contracts
        id: publish
        run: |
          python3 - <<'PYEOF'
          import os, sys
          from wxdi.data_contracts import DataContractsProvider
          from wxdi.data_contracts.models import DataContractPrototypeYaml
          from wxdi.dq_validator.provider.config import ProviderConfig

          token = os.environ["TOKEN"]
          bearer = token if token.startswith("Bearer ") else f"Bearer {token}"
          config = ProviderConfig(url=os.environ["URL"], auth_token=bearer)
          provider = DataContractsProvider(config)
          project_id = os.environ["PROJECT_ID"]

          files = "${{ steps.changed.outputs.all_changed_files }}".split()
          for f in files:
              name = os.path.splitext(os.path.basename(f))[0]
              with open(f, "r", encoding="utf-8") as fh:
                  content = fh.read()

              # Check if a contract with this name already exists
              collection = provider.list_project_data_contracts(project_id, limit=200)
              existing = next((dc for dc in collection.data_contracts if dc.name == name), None)

              body = DataContractPrototypeYaml(name=name, contract_yaml=content)
              if existing:
                  contract = provider.replace_project_data_contract(
                      project_id, existing.id, body, validate=False
                  )
                  print(f"Updated  {f}  →  id={contract.id}")
              else:
                  contract = provider.create_project_data_contract(
                      project_id, body, validate=False
                  )
                  print(f"Created  {f}  →  id={contract.id}")
          PYEOF

      # ── STAGE 3: TEST & POLL ──────────────────────────────────────────────
      - name: Trigger and poll test runs
        id: check
        run: |
          python3 - <<'PYEOF'
          import os, sys, time

          from wxdi.data_contracts import DataContractsProvider
          from wxdi.data_contracts.models import DataContractTestRequest
          from wxdi.dq_validator.provider.config import ProviderConfig

          token = os.environ["TOKEN"]
          bearer = token if token.startswith("Bearer ") else f"Bearer {token}"
          config = ProviderConfig(url=os.environ["URL"], auth_token=bearer)
          provider = DataContractsProvider(config)
          project_id = os.environ["PROJECT_ID"]

          MAX_POLLS = 30
          POLL_INTERVAL = 10

          check_md = "---\n## 🧪 Data Contract Test Run\n\n"
          check_overall = 0

          files = "${{ steps.changed.outputs.all_changed_files }}".split()
          for f in files:
              name = os.path.splitext(os.path.basename(f))[0]

              # Resolve contract ID by name
              collection = provider.list_project_data_contracts(project_id, limit=200)
              dc = next((c for c in collection.data_contracts if c.name == name), None)
              if dc is None:
                  print(f"WARNING: contract '{name}' not found — skipping test", file=sys.stderr)
                  continue

              # Trigger test run
              test_resp = provider.test_project_data_contract(
                  project_id, dc.id, DataContractTestRequest(retain_dq_objects=False)
              )
              run_id = test_resp.id
              print(f"Triggered test for {name}  run_id={run_id}")

              # Poll until terminal status
              result = None
              for _ in range(MAX_POLLS):
                  result = provider.get_project_data_contract_test_result(
                      project_id, dc.id, run_id, include_all_details=True
                  )
                  if result.status in ("completed", "failed"):
                      break
                  time.sleep(POLL_INTERVAL)

              status = result.status if result else "unknown"
              start  = result.start  if result else "-"
              end    = result.end    if result else "-"
              run_by = result.run_by if result else "-"

              if status == "completed":
                  check_md += f"### ✅ `{name}` — test completed\n"
              else:
                  check_overall = 1
                  check_md += f"### ❌ `{name}` — test **{status}**\n"

              check_md += f"> Run ID: `{run_id}` | Started: {start} | Ended: {end} | Run by: {run_by}\n\n"

              if result and result.check_results:
                  check_md += "**Check Results**\n\n"
                  check_md += "| Rule | Status | Passed |\n|---|---|---|\n"
                  for cr in result.check_results:
                      check_md += f"| {cr.check_name or '-'} | `{cr.status or '-'}` | {cr.passed} |\n"
                  check_md += "\n"

              warn_logs = [l for l in (result.logs if result else []) if l.level in ("error", "warn")]
              if warn_logs:
                  check_md += f"⚠️ {len(warn_logs)} log message(s)\n\n"

          # Write outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("body_check<<EOF\n")
              out.write(check_md + "\n")
              out.write("EOF\n")
              out.write(f"check_overall={check_overall}\n")
          PYEOF

      # ── FINAL COMMENT: validation + asset check combined ──────────────────
      - name: Upsert final PR comment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(printf "%b" "${{ steps.validate.outputs.body_val }}\n${{ steps.check.outputs.body_check }}")
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$BODY" \
            --repo "${{ github.repository }}" \
            --edit-last 2>/dev/null || \
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$BODY" \
            --repo "${{ github.repository }}"

      - name: Fail if asset check failed
        if: steps.check.outputs.check_overall == '1'
        run: exit 1
